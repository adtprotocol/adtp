# Demo node for bob.localhost. Local development settings: do not copy to production.
domain: bob.localhost

# Inside the demo's Docker network the nodes reach each other by service name.
public_url: http://bob:7387

addresses:
  - local: bob
    type: human
    routes:
      - match: { priority: urgent }
        channel: email
        to: bob+urgent@example.com
      - default: true
        channel: email
        to: bob@example.com
  - local: assistant
    type: agent
    name: Bob's assistant
    routes:
      - default: true
        channel: email
        to: bob-assistant@example.com

channels:
  email:
    from: "ADTP <adtp@bob.localhost>"
    smtp:
      host: mailpit
      port: 1025
    inbound:
      token: ${EMAIL_INBOUND_TOKEN}
    reply_to: reply+{token}@bob.localhost

delivery:
  backoff_base_seconds: 2

# No DNS in the demo: tell this node where alice.localhost's cards live, and
# allow plain http and private addresses.
discovery:
  allow_insecure: true
  overrides:
    alice.localhost: "http://alice:7387/.well-known/adtp/{local}"
