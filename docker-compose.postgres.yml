# Postgres instead of SQLite: adds a Postgres service and points the node at it.
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up
#
# To use a Postgres you already run, skip this file and set DATABASE_URL instead.
# A node switched over starts with an empty database: v0 does not copy messages
# from SQLite to Postgres.
services:
  node:
    environment:
      DATABASE_URL: postgres://adtp:${POSTGRES_PASSWORD:-adtp}@postgres:5432/adtp
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adtp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adtp}
      POSTGRES_DB: adtp
    volumes:
      - adtp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adtp -d adtp"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  adtp-postgres:
