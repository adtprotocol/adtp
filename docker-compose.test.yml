# Runs the whole test suite in containers: once on SQLite (the default
# database), once on a throwaway Postgres.
#   docker compose -f docker-compose.test.yml run --rm test
#   docker compose -f docker-compose.test.yml down --volumes
name: adtp-test

services:
  test:
    build:
      context: .
      target: build          # the stage with dev dependencies and compiled tests
    command: ["sh", "-c", "npm test && npm run test:postgres"]
    environment:
      TEST_DATABASE_URL: postgres://adtp:adtp@postgres:5432/adtp_test
      ADTP_TEST_REQUIRE_DB: "1"   # fail, rather than skip, if Postgres is missing
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adtp
      POSTGRES_PASSWORD: adtp
      POSTGRES_DB: adtp_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adtp -d adtp_test"]
      interval: 2s
      timeout: 3s
      retries: 30
