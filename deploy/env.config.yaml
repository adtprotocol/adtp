# A node set up entirely from environment variables: one address on one domain.
#
# This is the config the Docker image starts with when no other file is mounted
# at /app/adtp.config.yaml, so a hosting platform only has to set variables:
#
#   ADTP_DOMAIN        the domain in the address                 adtp.dev
#   ADTP_PUBLIC_URL    where other nodes reach this node         https://node.adtp.dev
#   ADTP_LOCAL         the address is <ADTP_LOCAL>@<ADTP_DOMAIN> source
#   ADTP_TYPE          human (the default) or agent
#   ADTP_CHANNEL       where its messages go: inbox (the default: kept on the
#                      node, read and answered at /admin) or agent (the event feed)
#   ADTP_LISTED        true to show the address in the domain's public directory
#   ADTP_DESCRIPTION   what the address is for (required when listed)
#   ADTP_FIRST_CONTACT held (the default: a stranger's first message waits for
#                      approval) or open (it is delivered at once)
#   ADTP_AUTO_REPLY    a text the node answers every message with, once per thread
#   ADTP_ADMIN_TOKEN, ADTP_AGENT_TOKEN   the two API tokens (generated into /data if not set)
#   PORT               the port to listen on, where the platform chooses it (default 7387)
#
# For more than one address, routes by priority, or email delivery, mount a
# config file of your own instead: adtp.config.yaml at the repository root
# shows every setting.
domain: ${ADTP_DOMAIN}
public_url: ${ADTP_PUBLIC_URL}

# Several platforms tell a container which port to listen on through PORT.
listen:
  port: ${PORT:-7387}

addresses:
  - local: ${ADTP_LOCAL}
    type: ${ADTP_TYPE:-human}
    listed: ${ADTP_LISTED:-false}
    description: ${ADTP_DESCRIPTION:-}
    first_contact: ${ADTP_FIRST_CONTACT:-held}
    auto_reply: ${ADTP_AUTO_REPLY:-}
    routes:
      - default: true
        channel: ${ADTP_CHANNEL:-inbox}
