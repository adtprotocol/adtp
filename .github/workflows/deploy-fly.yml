# Deploys the code on main to one Fly.io app that already exists, when someone
# asks for it: Actions, "Deploy to Fly.io", Run workflow, and the app's name.
# Nothing here runs by itself.
#
# It updates a node that deploy/fly/launch.sh started. The node's address,
# tokens and settings are secrets on the Fly app and are not touched, and its
# volume (signing key, messages) stays as it is.
#
# Needs one repository secret, FLY_API_TOKEN: a deploy token from the Fly.io
# dashboard (the app, Tokens), or an organization token to deploy several apps.
name: Deploy to Fly.io

on:
  workflow_dispatch:
    inputs:
      app:
        description: The Fly app to deploy to, for example adtp-welcome
        required: true
        type: string

permissions:
  contents: read

# One deploy per app at a time; a second one waits for the first.
concurrency:
  group: deploy-fly-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  deploy:
    # Only the public repository deploys, and only what is on main.
    if: github.repository == 'adtprotocol/adtp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP: ${{ inputs.app }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check the request
        run: |
          case "$APP" in
            ""|*[!a-z0-9-]*) echo "::error::\"$APP\" is not a Fly app name (lowercase letters, digits and hyphens)"; exit 1 ;;
          esac
          if [ -z "$FLY_API_TOKEN" ]; then echo "::error::The repository secret FLY_API_TOKEN is not set"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      # The app must exist already: this updates a node, it does not create one.
      - name: Check that the app exists
        run: flyctl status --app "$APP" >/dev/null

      - name: Build and deploy
        run: flyctl deploy --app "$APP" --ha=false

      - name: Show what is running
        run: flyctl status --app "$APP"
